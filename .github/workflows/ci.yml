name: CI

# Nothing in this repository was checked automatically before. The four
# memory-safety defects fixed in this branch were all reachable from an
# unauthenticated BLE or UART client, and all four would have been caught by
# the host job below. The firmware job exists because three of the four
# supported chips were never built by anyone routinely, so target-specific
# breakage could sit in the tree indefinitely.

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A force-push should not leave half-finished runs burning minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  host-tests:
    name: Host tests (sanitizers)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Runs the untrusted-input helpers under AddressSanitizer and
      # UndefinedBehaviorSanitizer. That combination is the point: the defects
      # being regression-tested were buffer overruns, and an overrun that
      # happens to land in unused stack passes a plain assertion.
      - name: Build and run
        run: make -C tests/host

  hygiene:
    name: Repository hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No hard-coded telemetry endpoint
        run: |
          # Every build used to ship pointing at an Ezlo internal
          # review-staging collector that nobody outside Ezlo can reach.
          #
          # Markdown is excluded deliberately. What has to be impossible is the
          # endpoint coming back in code or in a committed Kconfig/sdkconfig
          # default. The CHANGELOG and SECURITY notes have to be able to name
          # the host they removed, and an unscoped grep meant the documentation
          # of the fix failed the check that enforces the fix.
          #
          # Note this file does not match itself: the pattern is written with
          # escaped dots, so the literal hostname never appears here.
          if grep -rIn --exclude-dir=.git --exclude='*.md' 'opentelemetry\.ezlo\.com' .; then
            echo "::error::A hard-coded Ezlo telemetry endpoint is back in the tree."
            exit 1
          fi
          echo "clean"

      - name: Telemetry stays opt-in
        run: |
          # Open-telemetry has no default endpoint, so enabling it by default
          # produces a build that retries a connection forever and floods the
          # console.
          if grep -In 'CONFIG_EZPI_ENABLE_OPENTELEMETRY=y' sdkconfig.defaults*; then
            echo "::error::Open-telemetry must not be enabled in committed defaults."
            exit 1
          fi
          echo "clean"

      - name: Per-target defaults are wired up
        run: |
          # ESP-IDF only looks for sdkconfig.defaults.<target> variants of
          # files already in SDKCONFIG_DEFAULTS, and that list starts out
          # holding just sdkconfig.defaults. If the base file goes missing,
          # every per-target file is ignored silently and the build still
          # succeeds -- with the wrong configuration.
          test -f sdkconfig.defaults || {
            echo "::error::sdkconfig.defaults is missing; per-target defaults would be ignored."
            exit 1
          }
          for target in esp32 esp32s2 esp32s3 esp32c3; do
            test -f "sdkconfig.defaults.$target" || {
              echo "::error::sdkconfig.defaults.$target is missing."
              exit 1
            }
          done
          echo "all present"

      # CJSON_GET_VALUE_STRING_BY_COPY leaves its destination buffer untouched
      # when the JSON key is absent or is not a string -- there is no else
      # branch around the snprintf. Twelve of sixty-six call sites therefore
      # read uninitialised stack whenever a payload omitted a field, on inputs
      # arriving over BLE, UART and the cloud socket. The script explains the
      # mechanism in full.
      - name: JSON string destinations are initialised
        run: python3 tests/ci/check_uninit_json_buffers.py

      # The BLE chunk-reassembly functions copy a wire-supplied "len" bytes out
      # of a wire-supplied "data" string into a buffer sized from a
      # wire-supplied "total_len". There were two near-identical copies of that
      # function, one pasted from the other; the clamp was added to one and the
      # other kept an unauthenticated remote heap overflow. The characteristic
      # is ESP_GATT_PERM_WRITE with no passkey in any shipped defaults file.
      #
      # The same check pairs every parsed cJSON tree with a free of that same
      # variable, which is how a third leak in a different file turned up. It
      # self-tests against both the unclamped shape and the
      # two-trees-one-free shape on every run.
      - name: BLE chunk copies are clamped and trees are freed
        run: python3 tests/ci/check_ble_chunk_clamp.py

      # Every TRACE_* funnels into trace_color_print(), which had no printf
      # format attribute, so no format string in the tree was ever checked
      # against its arguments. webprov passed a cJSON * to a "%s" and the
      # logger read a struct as a string; CONFIG_EZPI_UTIL_TRACE_EN=y in all
      # four shipped defaults, so it was in every image. Adding the attribute
      # found that one defect and nothing else across all four targets.
      #
      # -Werror=format then enforces this on every build, but only while the
      # attribute exists. This check is what notices if it is ever removed.
      - name: TRACE_* format strings stay compiler-checked
        run: python3 tests/ci/check_trace_format_attr.py

      # config_ui.html's traffic log -- the thing a person screenshots into a
      # bug report -- printed every frame verbatim, and hub.network.get answers
      # with the stored Wi-Fi PSK as `key` beside `ssid`. Opening the Wi-Fi tab
      # wrote the PSK onto the page. Three more methods carry a credential in
      # their params. This check was written with the fix but never added to any
      # workflow, so until now it ran nowhere: a check that protects nothing is
      # worse than no check, because it reads as coverage.
      - name: Local configuration page cannot display a credential
        run: python3 tests/ci/check_ui_frame_redaction.py

      # GPIO_IS_VALID_GPIO() looks like a range check and is not one: it is
      # ((1ULL << pin) & SOC_GPIO_VALID_GPIO_MASK) != 0, with no range term at
      # all. A shift count past the register width is truncated rather than
      # rejected, so an out-of-range pin does not fail the test -- it aliases
      # onto a real pin and passes. Measured against all four target masks, pin
      # 70 is accepted as bit 6 and pin 64 as bit 0, and GPIO 6 is the SPI flash
      # clock. The fix is a single bound inside
      # EZPI_core_cjson_get_value_gpio(), reached through CJSON_GET_VALUE_GPIO.
      #
      # Sixteen pin reads across five drivers were on the general-purpose
      # integer readers instead, which do not and should not carry that bound,
      # and the worst of them (pms5003) had no GPIO_IS_VALID_GPIO of its own
      # either. Fixing sixteen sites does nothing about a seventeenth, and every
      # driver here was visibly written by copying another one. So this enforces
      # both halves: pin keys are read through the accessor, and the accessor
      # still bounds against GPIO_NUM_MAX -- delete that bound and all 144 call
      # sites keep compiling while silently protecting nothing.
      - name: Device-configuration pin numbers stay bounded
        run: python3 tests/ci/check_gpio_accessor.py

      # dht11.c guards its whole body, readDHT11 included, on
      # (S3||ESP32||S2), and sensor_0015_oneWire_DHT11.c, which calls it,
      # carried no guard at all. So on esp32c3 that file compiled into a
      # 190228-byte object holding "U readDHT11" -- a reference nothing in the
      # build defines. Neither the compiler nor the linker says a word: the
      # object sits in an archive whose only referrer, the EZLOPI_DEVICE_LIST
      # entry for device 15, is guarded by the same condition, so the member is
      # never pulled and the dangling reference is never resolved.
      #
      # The same drift elsewhere is not silent. Enabling
      # CONFIG_EZPI_ENABLE_LED_INDICATOR -- "default y" in Kconfig, switched
      # off in all four sdkconfig.defaults -- on esp32s2 fails the link, since
      # that service's #if/#elif chain has no esp32s2 arm while five of its
      # calls sit outside the chain. Measured: esp32s2 fails naming
      # ezpi_indicator_led_init, esp32s3 with the same option builds.
      #
      # Four prototypes were also declared for targets that define them
      # nowhere, including EZPI_SERV_cdc_init, whose header guard and
      # definition guard were exactly one target apart.
      - name: Target guards leave no call or prototype unbacked
        run: python3 tests/ci/check_target_guard_symmetry.py

      # A "*" width or precision reads an int. Eighteen sites handed it a
      # size_t -- fourteen now cast, four removed with the dead block they sat
      # in -- and no build this project runs can see that: size_t is int-sized
      # on all four ESP targets, so -Wformat has nothing to object to even
      # through TRACE_*, which does carry a printf format attribute, and even
      # under -Werror=format. Measured: 0 format warnings on esp32, esp32s2,
      # esp32s3 and esp32c3. The sites break only where size_t is wider than
      # int, which is a 64-bit host build -- so the two found before this check
      # existed were found by the host unit tests, and the other sixteen were
      # not found by anything.
      #
      # This is the only check in this job whose subject no compiler in the
      # pipeline can report, which is why it is a check and not a flag.
      - name: No printf "*" width or precision is given a size_t
        run: python3 tests/ci/check_printf_star_int.py

      # l_ezlopi_item_t.is_user_arg_unique means "this item frees user_arg",
      # and it is read in one place: ezlopi_device_free_item(), which recurses
      # over every item of a device. Four drivers handed one allocation to all
      # the items of one device and flagged every one of them -- SK6812 six,
      # the dimmable lamp five, RGB three, BME280 two -- so removing such a
      # device passed one pointer to free() that many times. Nothing documented
      # the field, and its name reads as "belongs to one device", which is what
      # SK6812's own comment said: "linked to only one device so 'TRUE'".
      #
      # Neither build reports it. CONFIG_EZPI_HEAP_ENABLE is unset in
      # sdkconfig.defaults for all four targets, which makes ezlopi_free a
      # NULL-checked free() -- a real double free; and with heap tracing on,
      # EZPI_core_util_heap_free looks for a node with freed == 0, finds none
      # and returns silently. So it corrupted the shipped build and hid in the
      # instrumented one.
      #
      # Reaching it needs no cloud traffic: __EZPI_initialize_devices_v3 frees
      # any device whose item fails to initialise, so a dimmable lamp on a pin
      # the hardware refuses is enough.
      #
      # Verified failing, not just passing: run against the tree as committed
      # before the fix, this check names exactly those four drivers. It also
      # fails if ezlopi_device_free_item() stops honouring the flag (every
      # shared arg would leak, silently) or if ezlopi_device_free_single()
      # stops collapsing duplicate ownership (which is what keeps a future
      # miscount to a leak rather than heap corruption).
      - name: No item user_arg has two owners
        run: python3 tests/ci/check_user_arg_owner.py

      # Eight lines across seven files printed a credential: the local API key
      # twice, the Wi-Fi PSK twice, the cloud provisioning token, the device's
      # SSL private key, and two whole request-body dumps -- one of which
      # exported it to an OpenTelemetry collector rather than to a console. The
      # last four were only found by going looking, which is what makes this a
      # class rather than a list, and nothing about fixing eight lines stops a
      # ninth.
      #
      # Also pins the default of each switch that is allowed to dump a secret
      # on purpose, because moving one of those is a security decision and
      # should not be possible to make by accident. Self-tests against the real
      # removed lines, including the case where a fix quotes the line it
      # replaced in a comment -- which is what made the first shell version of
      # this report every fixed site as still broken.
      - name: No credentials passed by value to a logging call
        run: python3 tests/ci/check_no_secret_logging.py

      # EZPI_core_factory_info_v3_set_basic() copied each string field out of a
      # caller-supplied pointer using the *destination field's* length as the
      # count. Two of three callers were safe only by coincidence -- their stack
      # arrays happen to be declared at exactly those lengths. webprov's are
      # not: 40/40/128/300 against fields of 0x7E/0x7E/0x100/0x200, so four
      # copies read 512 bytes of adjacent stack and wrote them into the
      # factory-info partition, which is readable back over BLE device-info and
      # the UART status query without authenticating.
      #
      # Confirmed as a genuine out-of-bounds read, not just an eyeballed one:
      # the same buffer layout under -fsanitize=address reports
      # "stack-buffer-overflow ... READ of size 126" and the bounded version
      # does not, while storing identical bytes.
      #
      # No compiler flag catches this -- set_basic() just received a pointer
      # and a length. The fix is one helper that bounds the copy by the source,
      # and this check is what stops it being inlined back into a memcpy.
      - name: factory-info field copies stay bounded by the source
        run: python3 tests/ci/check_finfo_bounded_store.py

      # The same partition, a different unbounded write. The four PEM setters
      # -- private key, public key, shared key, CA certificate -- took their
      # length from the position of a PEM end marker inside a client-supplied
      # string, with no upper bound, and handed it to a function that erases
      # one 4 KB field and writes len + 1. The fields are contiguous, so an
      # over-long CA certificate wrote into the private key and an over-long
      # shared key wrote into the hub data at 0x6000, which holds the serial
      # number and the Wi-Fi credentials. The spilled bytes land in flash the
      # call never erased, and NOR flash only clears bits on write, so the
      # neighbour is corrupted rather than replaced; the write stays inside
      # the partition, so esp_partition_write does not refuse it. Reachable
      # over BLE provisioning, unauthenticated in every shipped defaults
      # file, and over UART, which checks nothing.
      #
      # A missing marker was the other half: the old helper returned 0, and 0
      # reached the writer, which erased the field and stored an empty string
      # -- so a malformed certificate destroyed the stored one.
      #
      # The arithmetic is host-tested at 4094/4095/4096 in test_sanitize, but
      # this file needs esp_partition and cannot be host-compiled, so neither
      # "the setters call the bounded helper" nor "the backstop inside the
      # writer still exists" is reachable from a host test. That is what this
      # checks, along with the convention that the length excludes the
      # terminator the writer appends -- the config setter passed strlen + 1
      # and so wrote one byte of uninitialised heap into the partition. It
      # fails with eleven findings against the pre-fix file.
      - name: 4 KB factory-info writes stay inside their field
        run: python3 tests/ci/check_finfo_pem_bound.py

      # 83 files used to include the generated config as
      # "../../build/config/sdkconfig.h", which pins both the build
      # directory's name and its position relative to the source file -- so the
      # tree could not be built with idf.py -B <dir>. All 83 are now converted
      # to the plain #include "sdkconfig.h", which works because ESP-IDF
      # already puts the generated config directory on every component's
      # include path. The baseline is therefore zero and this step exists to
      # keep it there: a new file in the old style is one more file to convert
      # later, and nothing else would object.
      #
      # The script also self-tests its own comment scanner on every run, which
      # is not ceremony -- the first version of this check silently
      # undercounted, because "//*****" banner comments contain the substring
      # "/*" and a regex-based stripper treated them as opening a block
      # comment, swallowing the real #include below.
      - name: No pinned sdkconfig.h includes
        run: python3 tests/ci/check_sdkconfig_includes.py

      # cJSON_PrintPreallocated() returns false for an object that does not fit
      # *after* writing a truncated prefix, and it writes no terminator at the
      # truncation point. __otel_publish() ignored that return and also skipped
      # the memset that the three other live users of the shared transmit
      # buffer do, so strlen() ran off the end of the buffer and that length was
      # what got sent over the websocket -- with the previous holder of the
      # buffer being an API response. Two rules, reported separately on purpose:
      # with the memset but no return check the damage is a malformed fragment,
      # with the return check and no memset nothing escapes, and only the pair
      # reads out of bounds. Thirteen fixtures run first, one of them the
      # comment the fix left behind, because a check in this directory has
      # matched its own documentation before.
      - name: Every cJSON_PrintPreallocated result is consumed
        run: python3 tests/ci/check_print_preallocated_result.py

      # `%s` and `%[...]` in a scanf format write as far as the input reaches.
      # The last arm of the URL ladder in EZPI_parse_http_url() used both with
      # no field width, into host[100] and page[200], on a string that
      # EZPI_scenes_populate_fields_get_value allocates at strlen + 1 with no
      # cap -- so hub.scenes.action.block.test could choose the length of a
      # stack write. Measured under AddressSanitizer with the ladder reproduced
      # verbatim: "ftp://" + 599 characters + ":80/x" overflows host, and a
      # 599-character path overflows page by 601 bytes.
      #
      # The eight arms above it are all width-bounded, which is what made the
      # site survive review: it reads as a corner that cannot be reached. It
      # can -- arms seven and eight are catch-alls for the http:// and https://
      # prefixes, so only a third scheme gets this far, and then nothing is
      # bounded. -Wformat cannot object, because the format is well-formed and
      # the compiler does not know the destination size.
      #
      # Twenty-four fixtures run first, including the printf-family TRACE_S
      # eleven lines below the defect, because a check that reported every
      # unbounded "%s" in a string literal would report most of the tree.
      - name: Every scanf string conversion has a field width
        run: python3 tests/ci/check_scanf_field_width.py

      # The only check here that is not a grep over a known shape, because the
      # defect it covers is not a shape -- it is an ordering relation between a
      # dereference and the NULL test written to guard it. There were 34 of
      # them, the dominant one being a length trace sitting one line above its
      # own `if (ptr)`:
      #
      #   char *s = cJSON_PrintBuffered(__FUNCTION__, cj, 4096, false);
      #   TRACE_D("length of 's': %d", strlen(s));   /* deref */
      #   if (s)                                     /* guard, too late */
      #
      # cJSON_PrintBuffered returns NULL on allocation failure, and TRACE_D is
      # compiled into every shipped image (CONFIG_EZPI_UTIL_TRACE_EN=y in all
      # four defaults), so these were live crashes, reachable from the cloud
      # API, BLE and UART.
      #
      # The check was measured before being trusted, and its limits are
      # recorded in the script: it fails with exactly 34 findings against the
      # commit before the fix and passes after, but its recall on the two
      # check-after-use defects fixed earlier in this branch is 1 of 2, and it
      # missed a 30th instance of the idiom that a grep then found. A green run
      # means these cannot come back silently -- not that the class is absent.
      # The scan takes 12 seconds locally, plus the cppcheck install.
      - name: No null-pointer dereferences in first-party sources
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cppcheck
          python3 tests/ci/check_null_deref.py

      # The same class as the check above, by a different route, because that
      # one's recall is 1 of 2 on the known cases and the shape it misses is
      # structural rather than a tuning problem: a guard sitting in a sibling
      # block of the one holding the dereference. cppcheck does not report it
      # with or without the real build's 244 include paths, at any check level.
      #
      # This scanner gets both, and found a live one neither had: in
      # EZPI_core_modes_init(), sg_custom_modes was dereferenced on the line
      # after the parse that can return NULL, and the flag saying "custom modes
      # loaded" was set before the call -- so the default-mode fallback written
      # for that exact case was skipped too.
      #
      # It is line-oriented, so it is wrong in both directions on code it does
      # not parse. The first tree run gave 41 findings; all were read, 40 were
      # false in five classes, and each is now handled and pinned by a fixture
      # -- including assertion macros like PING_CHECK(ep, ...), which alone
      # accounted for 26. Sixteen fixtures run before the tree is scanned, half
      # of them correct code that must stay silent and half the same shape
      # written the wrong way round, so a suppression broad enough to kill the
      # noise is caught killing the signal. One class is vouched for inline
      # instead of solved, where data flow rather than a NULL test does the
      # guarding; the reason is required and a bare marker does not suppress.
      - name: No pointer dereferenced above its own NULL test
        run: python3 tests/ci/check_check_after_use.py

      # The CHANGELOG is this fork's main deliverable and carries 230-odd
      # links into the source, most with a #L<n> fragment. Line numbers move
      # whenever anything above them is edited, and a link to a renamed file
      # or a line past the end of one renders as ordinary text while reading
      # as evidence. This catches the three mechanical failures -- path gone,
      # file shorter than the cited line, and link text disagreeing with its
      # own fragment, which is how it found `factory_info.c:140` pointing at
      # #L135. It cannot tell whether a resolving line is the *right* line;
      # that is a person's job, and the docstring says so.
      - name: Documentation citations resolve
        run: python3 tests/ci/check_doc_citations.py

  firmware:
    name: Build ${{ matrix.target }}
    runs-on: ubuntu-latest
    # Pinned to the exact IDF release the project targets. The README used to
    # claim v4.4.4 in one place and v4.4.6 in another; this file is now the
    # authoritative answer.
    container: espressif/idf:v4.4.6
    strategy:
      # One chip failing should not hide the state of the other three.
      fail-fast: false
      matrix:
        target: [esp32, esp32s2, esp32s3, esp32c3]
    steps:
      - uses: actions/checkout@v4

      - name: Build
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target ${{ matrix.target }}
          idf.py build

      # Confirms the per-target defaults were actually applied rather than the
      # build falling back to Kconfig defaults, which would still compile.
      - name: Check the generated configuration
        shell: bash
        run: |
          grep -q "^CONFIG_IDF_TARGET=\"${{ matrix.target }}\"" sdkconfig
          grep -q '^CONFIG_PARTITION_TABLE_CUSTOM_FILENAME=' sdkconfig
          echo "configuration inherited from sdkconfig.defaults.${{ matrix.target }}"

      # All four shipped configurations have CONFIG_EZPI_LOCAL_WEBSOCKET_SERVER
      # on, so all four must advertise the _ezlo._tcp record that points at it.
      # That advert is now behind an #if, and the failure this guards against
      # is the guard being wrong in the other direction: if it were inverted or
      # its symbol renamed, every shipped image would silently stop announcing
      # itself and only the MQTT job -- which asserts the opposite -- would
      # still pass. A hub that no Ezlo client can discover is a serious
      # regression that produces no error message anywhere.
      #
      # mdns_service_add is the right symbol to look for because the linker
      # drops it when nothing calls it, which is exactly what the MQTT job
      # relies on. Note this has to use nm: the symbol also appears in the
      # linker map's discarded-sections and cross-reference lists even when it
      # is not linked in, so grepping the .map would pass either way.
      - name: Confirm this build advertises itself over mDNS
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          case "${{ matrix.target }}" in
            esp32)   NM=xtensa-esp32-elf-nm ;;
            esp32s2) NM=xtensa-esp32s2-elf-nm ;;
            esp32s3) NM=xtensa-esp32s3-elf-nm ;;
            esp32c3) NM=riscv32-esp-elf-nm ;;
            *) echo "::error::no nm mapping for ${{ matrix.target }}"; exit 1 ;;
          esac
          grep -q '^CONFIG_EZPI_SERV_MDNS_EN=y' sdkconfig || {
            echo "::error::CONFIG_EZPI_SERV_MDNS_EN is off, so this check is meaningless."
            exit 1
          }
          grep -q '^CONFIG_EZPI_LOCAL_WEBSOCKET_SERVER=y' sdkconfig || {
            echo "::error::CONFIG_EZPI_LOCAL_WEBSOCKET_SERVER is off in the shipped"
            echo "::error::defaults for ${{ matrix.target }}; that is a change in its own right."
            exit 1
          }
          "$NM" build/*.elf > mdns-symbols.txt
          if ! grep -q 'mdns_service_add' mdns-symbols.txt; then
            echo "::error::mdns_service_add is absent, so this image announces no service."
            echo "::error::Check the #if around mdns_service_add() in ezlopi_core_mdns.c."
            exit 1
          fi
          echo "mDNS service advert is linked in for ${{ matrix.target }}."

      # The certificate bundle is embedded in all four shipped images whether
      # or not OTA is enabled, because ezlopi_core_http.c calls
      # esp_crt_bundle_attach() and that links both the code and the blob. So
      # its contents are a property of every build, not just the OTA ones, and
      # this runs here rather than only in firmware-ota-bundle.
      #
      # What it guards is a documentation claim with no other enforcement. The
      # four targets do not agree on which root set they use -- esp32 is CMN
      # (36 roots), the other three are FULL (136) -- and the Kconfig help for
      # EZPI_OTA_CA_BUNDLE now states, per target, which roots a self-hosted
      # firmware server can present. Nothing in a build would notice that going
      # stale: ESP-IDF generates the bundle from its own CSV and PEM, embeds
      # whatever is in it, and esp_crt_bundle_attach() returns ESP_OK either
      # way. Bumping the IDF pin is enough to make the documentation wrong, and
      # the first symptom would be a hub in the field failing an update with a
      # TLS error.
      #
      # The check is bidirectional, which matters: it fails if a root the docs
      # promise goes missing, and equally if a root the docs warn is absent
      # turns up. The esp32 "Let's Encrypt does not work here" warning is only
      # worth printing while it is true, and CMN still carries the expired DST
      # Root CA X3 that Let's Encrypt used to cross-sign from, so "an ISRG root
      # is in there somewhere" is not a safe assumption to leave unchecked.
      - name: Confirm the embedded CA bundle holds the roots the docs promise
        shell: bash
        run: python3 tests/ci/check_ota_ca_bundle_roots.py build

      # A flashable install is four images at four offsets: bootloader,
      # partition table, OTA data, application. The artifact below uploads
      # "build/*.bin", which is a non-recursive glob -- it matched the
      # application and ota_data_initial.bin and missed
      # build/bootloader/bootloader.bin and
      # build/partition_table/partition-table.bin, both of which are in
      # subdirectories. So the artifact could update a board already running
      # EzloPi but could not bring up a blank one, and nothing said so.
      #
      # Merging also produces the only form ESP Web Tools accepts for an
      # ESP-IDF v4 project: one image written at offset 0. See install/.
      #
      # The offsets are not written here. esptool reads them from
      # build/flash_args, which the build itself generated, so this step cannot
      # drift from the partition table -- and it has to not drift, because the
      # bootloader is at 0x1000 on esp32 and esp32s2 but at 0x0 on esp32s3 and
      # esp32c3.
      - name: Merge the flashable image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          cd build
          esptool.py --chip ${{ matrix.target }} merge_bin \
            -o merged-firmware.bin @flash_args

      # "esptool exited 0" is not evidence. esptool is being asked to copy
      # bytes to offsets, and the mistakes worth catching -- a wrong offset, a
      # missing input -- are both successful esptool runs. This asserts every
      # listed image is byte-identical inside the merged file at its own
      # offset.
      - name: Verify the merged image
        shell: bash
        run: python3 tests/ci/check_merged_bin.py build

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-${{ matrix.target }}
          path: |
            build/*.bin
            build/*.elf
            build/*.map
            build/flash_args
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            sdkconfig
          if-no-files-found: error

  # Every job above builds into the default <project>/build, so none of them
  # would notice the tree becoming unbuildable anywhere else. It used to be:
  # 83 files included the generated config as "../../build/config/sdkconfig.h",
  # which hard-codes both the build directory's name and its position, and
  # "idf.py -B <dir>" failed with
  #   fatal error: ../../build/config/sdkconfig.h: No such file or directory
  # while still building perfectly into ./build. That is a failure mode no
  # amount of in-tree building can see.
  #
  # The hygiene job checks the include *style*; this job checks the
  # *capability*, which is the thing anyone actually cares about. Keeping both
  # is deliberate: the style check localises a regression to the offending file
  # and names it, and this one proves the style check is guarding something
  # real rather than enforcing a convention for its own sake.
  #
  # The build directory is placed outside the workspace on purpose -- a sibling
  # directory would still be found by a relative path containing enough "..".
  firmware-outdir:
    name: Build esp32 (out-of-tree build directory)
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - uses: actions/checkout@v4

      - name: Build into a directory outside the project
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          OUT=/tmp/ezlopi-outdir-build
          idf.py -B "$OUT" set-target esp32
          idf.py -B "$OUT" build
          echo "OUT=$OUT" >> "$GITHUB_ENV"

      - name: Confirm it really built out of tree
        shell: bash
        run: |
          # If the application landed in the out-of-tree directory and no
          # ./build was created at all, then nothing fell back to the default
          # location and no relative path to "build/config" could have resolved.
          test -f "$OUT/Ezlo_Pi_v4x.bin" || {
            echo "::error::no application image in $OUT; the -B build did not produce one."
            exit 1
          }
          if [ -e build ]; then
            echo "::error::a ./build directory exists, so something ignored -B."
            ls -la build
            exit 1
          fi
          echo "built into $OUT with no ./build: out-of-tree builds work."

  # ezlopi_core_ota.c is entirely wrapped in "#ifdef CONFIG_EZPI_ENABLE_OTA",
  # and that symbol is "not set" in every committed sdkconfig.defaults.*. The
  # four builds above therefore compile none of it, so they cannot catch a
  # syntax error, an unused variable or a changed IDF signature in the update
  # path. This job turns the feature on for one target so the file is at least
  # compiled on every push.
  #
  # It needs ca_mios.h, which is deliberately not in the repository (it is in
  # .gitignore, because it holds the CA chain for Ezlo's own OTA host). A
  # throwaway placeholder is generated here: this job only ever compiles, it
  # never connects to anything, so the contents just have to be a valid C
  # string literal. Nothing in the uploaded artifacts above comes from here.
  firmware-ota:
    name: Build esp32 (OTA enabled)
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - uses: actions/checkout@v4

      - name: Generate a placeholder CA header
        shell: bash
        run: |
          cat > ezlopi-core/ezlopi-core-ota/ca_mios.h <<'EOF'
          /* CI placeholder. Not a usable certificate -- compile coverage only. */
          #ifndef _CA_MIOS_H_
          #define _CA_MIOS_H_
          static const char ca_mios[] =
              "-----BEGIN CERTIFICATE-----\n"
              "PLACEHOLDER-FOR-COMPILE-COVERAGE-ONLY\n"
              "-----END CERTIFICATE-----\n";
          #endif
          EOF

      # The fragment is appended to the per-target defaults file rather than
      # passed via -DSDKCONFIG_DEFAULTS. Overriding that variable did build, but
      # left CONFIG_EZPI_ENABLE_OTA unset, so the job compiled exactly as little
      # as the other four and only the assertion below revealed it. Appending to
      # the file ESP-IDF already applies last is the same mechanism the four
      # firmware jobs use, so it cannot diverge from them. The checkout is
      # ephemeral, so the committed defaults are untouched.
      - name: Enable OTA in the per-target defaults
        shell: bash
        run: |
          cat tests/ci/sdkconfig.ota_enabled >> sdkconfig.defaults.esp32
          echo "--- tail of sdkconfig.defaults.esp32 ---"
          tail -5 sdkconfig.defaults.esp32

      - name: Build with OTA enabled
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      # Guards against the fragment silently failing to apply, which would make
      # this job pass while compiling exactly as little as the others do. This
      # has already caught one such case, so it stays.
      - name: Confirm OTA was actually compiled in
        shell: bash
        run: |
          if ! grep -q '^CONFIG_EZPI_ENABLE_OTA=y' sdkconfig; then
            echo "::error::CONFIG_EZPI_ENABLE_OTA did not get enabled; this job proved nothing."
            echo "--- what the generated sdkconfig says instead ---"
            grep -n 'EZPI_ENABLE_OTA\|EZPI_ENABLE_WIFI\|EZPI_CORE_ENABLE_ETH' sdkconfig || echo "(no matching lines at all)"
            exit 1
          fi
          echo "OTA compiled in"

      # This job does not set a CA source, so it exercises whatever the Kconfig
      # default is. Asserting that the default is still the pinned header is
      # the point: EZPI_OTA_CA_BUNDLE widens trust from one chain to every root
      # ESP-IDF embeds, and it must never become the default by accident. If
      # someone flips the Kconfig default, this fails and says why.
      - name: Confirm the pinned header is still the default CA source
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          if ! grep -q '^CONFIG_EZPI_OTA_CA_HEADER=y' sdkconfig; then
            echo "::error::OTA is on but the pinned header is not the selected CA source."
            echo "::error::Nothing here asked for a CA source, so this is the Kconfig default having changed."
            echo "::error::The default must stay EZPI_OTA_CA_HEADER: the bundle trusts every root IDF embeds."
            grep -n 'EZPI_OTA_CA' sdkconfig || echo "(no EZPI_OTA_CA lines at all)"
            exit 1
          fi
          # The pinned chain has to actually reach the image. ca_mios is a
          # file-scope array, so it survives in the symbol table -- and unlike
          # esp_crt_bundle_attach it genuinely discriminates between the two
          # modes. esp_crt_bundle_attach is linked in BOTH, so asserting on it
          # would pass either way and prove nothing.
          #
          # Not because "mbedtls links it regardless", which is what this
          # comment used to say and is wrong -- the linker does drop it when
          # nothing references it. It is because ezlopi_core_http.c references
          # it unconditionally for the outbound provision-sync call, which
          # pulls in both the function and the embedded bundle blob on every
          # target whether OTA is on or off. Read out of the .map of real
          # esp32 and esp32c3 builds, not assumed.
          xtensa-esp32-elf-nm build/*.elf > ota-symbols.txt
          if ! grep -q ' ca_mios$' ota-symbols.txt; then
            echo "::error::CONFIG_EZPI_OTA_CA_HEADER is set but ca_mios is not in the image,"
            echo "::error::so this build has no pinned certificate. Check the #if around"
            echo "::error::.cert_pem in ezlopi_ota_process()."
            exit 1
          fi
          echo "pinned CA present and selected by default"

  # The companion to firmware-ota, covering the other half of the
  # EZPI_OTA_CA_SOURCE choice. firmware-ota generates a placeholder ca_mios.h,
  # so it can only ever prove the pinned path compiles. This job builds the
  # bundle path with NO ca_mios.h anywhere in the tree, which is the thing
  # being claimed: that enabling OTA no longer requires a hand-written header,
  # so a clean clone can produce an OTA-capable image and firmware can be
  # self-hosted behind any ordinary public certificate.
  #
  # Deliberately no "Generate a placeholder CA header" step here. Its absence
  # is the test, and the job asserts the absence rather than trusting it --
  # ca_mios.h is gitignored, so a stray local copy could otherwise make this
  # pass for the wrong reason.
  firmware-ota-bundle:
    name: Build esp32 (OTA enabled, IDF cert bundle)
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - uses: actions/checkout@v4

      - name: Select the certificate bundle in the per-target defaults
        shell: bash
        run: |
          cat tests/ci/sdkconfig.ota_bundle >> sdkconfig.defaults.esp32
          echo "--- tail of sdkconfig.defaults.esp32 ---"
          tail -5 sdkconfig.defaults.esp32

      - name: Confirm no pinned CA header exists
        shell: bash
        run: |
          if [ -e ezlopi-core/ezlopi-core-ota/ca_mios.h ]; then
            echo "::error::ca_mios.h exists in the checkout. This job only means something"
            echo "::error::without it -- the claim under test is that the bundle option needs"
            echo "::error::no hand-written header. Remove it, or fix whatever added it."
            exit 1
          fi
          echo "no ca_mios.h, as required"

      - name: Build with OTA enabled against the IDF certificate bundle
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      - name: Confirm this really is the bundle path
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          for want in CONFIG_EZPI_ENABLE_OTA CONFIG_EZPI_OTA_CA_BUNDLE CONFIG_MBEDTLS_CERTIFICATE_BUNDLE; do
            if ! grep -q "^${want}=y" sdkconfig; then
              echo "::error::${want} is not set, so this job proved nothing."
              grep -n 'EZPI_OTA_CA\|EZPI_ENABLE_OTA\|MBEDTLS_CERTIFICATE_BUNDLE' sdkconfig || echo "(nothing matched)"
              exit 1
            fi
          done
          xtensa-esp32-elf-nm build/*.elf > ota-bundle-symbols.txt
          # The discriminator is ca_mios, NOT esp_crt_bundle_attach. The latter
          # is present in both modes -- ezlopi_core_http.c references it
          # unconditionally, which links it and the bundle blob regardless of
          # this option -- so it cannot tell the two configurations apart.
          # ca_mios can: it only exists when the pinned header was compiled in.
          if grep -q ' ca_mios$' ota-bundle-symbols.txt; then
            echo "::error::ca_mios is in the image even though the bundle was selected."
            echo "::error::The pinned header leaked past its #if in ezlopi_core_ota.c."
            exit 1
          fi
          # And the OTA code itself must still be compiled in, so that the
          # absence above means "bundle mode" rather than "OTA quietly off".
          if ! grep -q ' esp_https_ota$' ota-bundle-symbols.txt; then
            echo "::error::esp_https_ota is absent, so no OTA code was compiled in at all"
            echo "::error::and the ca_mios check above passed for the wrong reason."
            exit 1
          fi
          echo "bundle path confirmed: OTA linked in, no pinned certificate"

  # Same reasoning as firmware-ota: the Improv sources sit entirely behind
  # CONFIG_EZPI_BLE_ENABLE_IMPROV and CONFIG_EZPI_ENABLE_IMPROV_SERIAL, both of
  # which are "not set" in all four committed sdkconfig.defaults.* files.
  # Without this job a green CI run would say nothing about any of them --
  # ezlopi_service_ble_improv.c, ezlopi_service_improv.c,
  # ezlopi_service_improv_serial.c, the filter call in ezlopi_service_uart.c or
  # the Improv advertisement in ezlopi_core_ble_gap.c.
  #
  # Both transports are enabled together. That is the configuration worth
  # building, because it is the only one in which the shared core in
  # ezlopi-service-improv has more than one registered transport: with a single
  # transport, a broadcast and an addressed reply go to the same place, so
  # confusing the two is invisible. It is also the configuration in which a
  # reintroduced second copy of the state machine -- the BLE transport carried
  # one until the serial work removed it -- becomes a duplicate-symbol link
  # error rather than silent drift. See tests/ci/sdkconfig.improv_enabled.
  #
  # This job is also what exercises the _Static_assert guarding the 31-byte
  # advertising payload, and that assert is the only automated check on the
  # budget: esp_ble_gap_config_adv_data() returns ESP_OK whether or not the
  # elements fitted, and an over-budget payload drops its trailing service data
  # element silently. The symptom on a device is just "Improv clients do not
  # offer provisioning", with nothing in the log. Compiling this configuration
  # is what turns that into a build failure instead.
  firmware-improv:
    name: Build esp32 (Improv enabled, both transports)
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - uses: actions/checkout@v4

      # Appended to the per-target defaults for the same reason the OTA job
      # does it: -DSDKCONFIG_DEFAULTS builds fine but leaves the symbol unset,
      # which would make this job compile as little as the other four. esp32 is
      # the target because its committed defaults already carry both
      # CONFIG_EZPI_BLE_ENABLE=y and CONFIG_EZPI_ENABLE_WIFI=y, the two symbols
      # CONFIG_EZPI_BLE_ENABLE_IMPROV depends on.
      - name: Enable Improv in the per-target defaults
        shell: bash
        run: |
          cat tests/ci/sdkconfig.improv_enabled >> sdkconfig.defaults.esp32
          echo "--- tail of sdkconfig.defaults.esp32 ---"
          tail -5 sdkconfig.defaults.esp32

      - name: Build with Improv enabled
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      - name: Confirm Improv was actually compiled in
        shell: bash
        run: |
          # Both symbols are checked, not just one. A fragment that sets only
          # the BLE option still builds green, and would leave the serial
          # transport and the single-transport/multi-transport distinction
          # above untested while looking exactly like a pass.
          missing=0
          for sym in CONFIG_EZPI_BLE_ENABLE_IMPROV CONFIG_EZPI_ENABLE_IMPROV_SERIAL; do
            if ! grep -q "^$sym=y" sdkconfig; then
              echo "::error::$sym did not get enabled; this job proved less than it claims."
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "--- what the generated sdkconfig says instead ---"
            grep -n 'EZPI_BLE_ENABLE\|EZPI_ENABLE_WIFI\|IMPROV' sdkconfig || echo "(no matching lines at all)"
            exit 1
          fi
          echo "Improv compiled in, both transports"

      # The symbol in the ELF is the evidence that the guarded body was reached.
      # The config assertion above only proves the Kconfig symbol was set; this
      # proves the file behind it was compiled and linked rather than
      # preprocessed away to nothing, which is how the whole of
      # ezlopi_core_ota.c used to escape CI.
      #
      # The symbol table is written to a file rather than piped straight into
      # grep. "shell: bash" means Actions runs the step as
      # "bash --noprofile --norc -eo pipefail", and with pipefail set,
      # "nm ... | grep -q" fails even when the symbol is present: grep -q exits
      # the instant it matches, nm is still writing the other ~13800 symbols,
      # so nm dies of SIGPIPE and the pipeline reports 141. That is exactly how
      # this step failed on its first run, while the symbol was in the ELF the
      # whole time. Redirecting to a file lets nm finish, keeps pipefail on for
      # the rest of the step, and leaves the table available for the diagnostic
      # dump below.
      - name: Confirm the Improv service is linked into the image
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          xtensa-esp32-elf-nm build/*.elf > improv-symbols.txt

          # One symbol per thing that could be preprocessed away independently:
          # the GATT transport, the serial transport's filter entry point (the
          # function ezlopi_service_uart.c calls on the raw byte buffer), and
          # the shared core both of them register into.
          missing=0
          for sym in EZPI_ble_service_improv_init \
                     EZPI_SERV_improv_serial_filter \
                     EZPI_SERV_improv_transport_register; do
            if ! grep -q "$sym" improv-symbols.txt; then
              echo "::error::$sym is absent from the ELF; that part was not linked in."
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "--- every Improv symbol the image does contain ---"
            grep -i improv improv-symbols.txt || echo "(none at all)"
            exit 1
          fi
          echo "Improv linked into the image: GATT transport, serial transport and shared core"
          grep -i improv improv-symbols.txt

  # Same reasoning as firmware-ota and firmware-improv: the whole body of
  # ezlopi_service_mqtt.c sits behind CONFIG_EZPI_ENABLE_MQTT, which is "not
  # set" in all four committed sdkconfig.defaults.* files, so the four target
  # builds compile none of it.
  #
  # Both websocket transports are turned off in this job. That is the point of
  # it, not an incidental choice -- see the long note in
  # tests/ci/sdkconfig.mqtt_enabled. In short, it is the only configuration
  # that reaches the broadcast-pump condition in ezlopi_main.c and the only one
  # that would have caught the unguarded EZPI_service_webprov_is_connected()
  # call in ezlopi_service_uart.c, which made a hub built without the websocket
  # client fail to compile at all.
  #
  # It is also exactly what a Home Assistant user who does not want the Ezlo
  # cloud builds, so it is worth keeping green for its own sake.
  firmware-mqtt:
    name: Build esp32 (MQTT enabled, no websockets)
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - uses: actions/checkout@v4

      # Appended to the per-target defaults rather than passed via
      # -DSDKCONFIG_DEFAULTS, for the same reason the OTA and Improv jobs do
      # it: the latter builds fine but leaves the symbol unset, which would
      # make this job compile as little as the other four.
      - name: Enable MQTT and disable both websocket transports
        shell: bash
        run: |
          cat tests/ci/sdkconfig.mqtt_enabled >> sdkconfig.defaults.esp32
          echo "--- tail of sdkconfig.defaults.esp32 ---"
          tail -6 sdkconfig.defaults.esp32

      - name: Build with MQTT enabled and no websockets
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      - name: Confirm the configuration is the one this job claims to build
        shell: bash
        run: |
          # All three symbols are checked. Asserting only that MQTT is on would
          # let the websocket options stay enabled -- the fragment disables
          # them with "# CONFIG_... is not set" lines, and if confgen ever
          # stopped honouring those in a defaults file this job would quietly
          # become a duplicate of the ordinary esp32 build plus MQTT, testing
          # neither of the two things it exists for.
          fail=0
          grep -q '^CONFIG_EZPI_ENABLE_MQTT=y' sdkconfig || {
            echo "::error::CONFIG_EZPI_ENABLE_MQTT did not get enabled; this job proved nothing."
            fail=1
          }
          for sym in CONFIG_EZPI_LOCAL_WEBSOCKET_SERVER CONFIG_EZPI_WEBSOCKET_CLIENT; do
            if grep -q "^$sym=y" sdkconfig; then
              echo "::error::$sym is still enabled; the no-websocket configuration was not built."
              fail=1
            fi
          done
          if [ $fail -ne 0 ]; then
            echo "--- what the generated sdkconfig says instead ---"
            grep -n 'EZPI_ENABLE_MQTT\|EZPI_MQTT_\|WEBSOCKET' sdkconfig || echo "(no matching lines at all)"
            exit 1
          fi
          echo "Built with MQTT on and both websocket transports off"

      # The config assertion above only proves the Kconfig symbols were set.
      # These prove the guarded code was compiled and linked rather than
      # preprocessed away, which is how the whole of ezlopi_core_ota.c used to
      # escape CI.
      #
      # Symbol table written to a file rather than piped into grep: with
      # "shell: bash" Actions runs steps under "bash -eo pipefail", and
      # "nm ... | grep -q" fails even when the symbol is present, because
      # grep -q exits on first match while nm is still writing thousands of
      # symbols and dies of SIGPIPE. That is how the equivalent Improv step
      # failed on its first run while the symbol was there the whole time.
      - name: Confirm the MQTT service and the broadcast pump are both linked
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          xtensa-esp32-elf-nm build/*.elf > mqtt-symbols.txt

          # One symbol per thing that can disappear independently: the service
          # entry point, the mapping layer in ezlopi-util-ha, the topic parser
          # that inbound commands go through, and esp-mqtt's non-blocking
          # publish -- the service must use enqueue rather than publish because
          # it runs on the loop-service task while that task holds the global
          # serialization buffer.
          missing=0
          for sym in EZPI_service_mqtt_init \
                     EZPI_ha_describe \
                     EZPI_ha_parse_command_topic \
                     esp_mqtt_client_enqueue; do
            if ! grep -q "$sym" mqtt-symbols.txt; then
              echo "::error::$sym is absent from the ELF; that part was not linked in."
              missing=1
            fi
          done
          if [ $missing -ne 0 ]; then
            echo "--- every MQTT/HA symbol the image does contain ---"
            grep -iE 'mqtt|EZPI_ha_' mqtt-symbols.txt || echo "(none at all)"
            exit 1
          fi

          # The one that is specific to this configuration. EZPI_service_mqtt_init
          # being present says nothing about whether item updates can reach it:
          # that depends on EZPI_service_broadcast_init() installing the queue
          # the broadcast methods are fed from, and in ezlopi_main.c that call
          # is behind an #if which listed only the two websocket transports
          # until MQTT was added to it. With both of those off and the MQTT
          # term missing, the service would publish its discovery payloads and
          # then never send another message -- silently, with nothing in the
          # log. Removing that term was verified to make this symbol vanish
          # from app_main, so this check is known to be able to fail.
          if ! grep -q 'EZPI_service_broadcast_init' mqtt-symbols.txt; then
            echo "::error::EZPI_service_broadcast_init is absent, so no item update can reach MQTT."
            echo "::error::Check the #if around it in ezlopi_main.c still names CONFIG_EZPI_ENABLE_MQTT."
            exit 1
          fi

          echo "MQTT linked in: service, mapping, topic parser, non-blocking publish, broadcast pump"
          grep -iE 'EZPI_service_mqtt_init|EZPI_ha_|EZPI_service_broadcast_init' mqtt-symbols.txt

      # The mirror image of the check in the four-target job, and the reason
      # this configuration is worth building. mDNS is still on here, but there
      # is no local websocket server: with CONFIG_EZPI_LOCAL_WEBSOCKET_SERVER
      # off, ezlopi_main.c calls EZPI_service_ws_server_dummy() instead of
      # EZPI_service_ws_server_start(), and the dummy does nothing, so the IP
      # event handler that would call httpd_start() is never registered and
      # nothing ever listens on the port.
      #
      # The advert used to be unconditional, so this build announced
      # _ezlo._tcp on a port with no listener and any client that discovered
      # the hub got a refused connection. Asserting the absence rather than
      # the presence is deliberate: the bug being guarded is advertising a
      # service that does not exist, and the only way to catch its return is
      # to require the symbol be gone.
      - name: Confirm no service is advertised on a port with no listener
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          # The assertion is only meaningful if mDNS is actually compiled in;
          # otherwise "no advert" would be true for an uninteresting reason.
          grep -q '^CONFIG_EZPI_SERV_MDNS_EN=y' sdkconfig || {
            echo "::error::CONFIG_EZPI_SERV_MDNS_EN is off, so this check proves nothing."
            exit 1
          }
          if grep -q 'mdns_service_add' mqtt-symbols.txt; then
            echo "::error::mdns_service_add is linked in, but nothing listens on that port"
            echo "::error::in this configuration. The _ezlo._tcp advert in"
            echo "::error::ezlopi_core_mdns.c must stay behind CONFIG_EZPI_LOCAL_WEBSOCKET_SERVER."
            exit 1
          fi
          # EZPI_init_mdns itself must survive: the hostname is still set, so
          # <hostname>.local still resolves. If this vanished it would mean the
          # whole service had been guarded out, which is more than intended.
          if ! grep -q 'EZPI_init_mdns' mqtt-symbols.txt; then
            echo "::error::EZPI_init_mdns is absent; mDNS hostname resolution was lost too."
            exit 1
          fi
          echo "no _ezlo._tcp advert in this build, and hostname resolution is retained"

  # The only job that compiles four blocks of ezlopi_core_mdns.c at all.
  #
  # CONFIG_EZPI_MDNS_ENABLE_EXTRA_SERVICES is "default n" in Kconfig and
  # "is not set" in all four sdkconfig.defaults.* files, and the four
  # per-service symbols depend on it. So the manufacturer, brand, model and
  # name TXT records are built by no configuration in this repository: the
  # four-target matrix, the OTA jobs, the Improv job and the MQTT job above all
  # preprocess them away. A fully green run said nothing whatever about them.
  #
  # That is not a hypothetical worry. Those blocks are where the
  # free-of-a-string-literal fixed in CHANGELOG's "Ownership of an mDNS TXT
  # value was decided by comparing the string" entry lived -- a factory-info
  # getter returning NULL put the literal "null" into a node that the free
  # routine then handed to free(). The two unconditional nodes cannot reach
  # that, so the defect sat in exactly the code CI did not compile, for as long
  # as the file has existed.
  #
  # The fragment is appended here only. The shipped defaults are untouched, so
  # the extra services stay off in every image anyone flashes.
  firmware-mdns-extra:
    name: Build esp32 (mDNS extra services)
    runs-on: ubuntu-latest
    container: espressif/idf:v4.4.6
    steps:
      - uses: actions/checkout@v4

      # Appended to the per-target defaults rather than passed via
      # -DSDKCONFIG_DEFAULTS, for the same reason the OTA, Improv and MQTT jobs
      # do it: the latter builds fine but leaves the symbol unset, which would
      # make this job compile exactly as little as the other five.
      - name: Enable the four optional mDNS TXT services
        shell: bash
        run: |
          cat tests/ci/sdkconfig.mdns_extra_services >> sdkconfig.defaults.esp32
          echo "--- tail of sdkconfig.defaults.esp32 ---"
          tail -6 sdkconfig.defaults.esp32

      - name: Build with the extra mDNS services enabled
        shell: bash
        run: |
          . "$IDF_PATH/export.sh"
          idf.py set-target esp32
          idf.py build

      - name: Confirm the configuration is the one this job claims to build
        shell: bash
        run: |
          # Checked in two places, because they can disagree and only one of
          # them decides what the compiler sees. A symbol can be present in
          # sdkconfig and still be absent from the generated header if confgen
          # drops it for an unmet dependency -- and it is the header that the
          # #ifdefs in ezlopi_core_mdns.c are resolved against. Asserting only
          # the sdkconfig side would let this job report success over a build
          # in which all four blocks were still preprocessed away, which is the
          # precise failure it exists to prevent.
          fail=0
          for sym in CONFIG_EZPI_MDNS_ENABLE_EXTRA_SERVICES \
                     CONFIG_EZPI_MDNS_ENABLE_MANUFACTURER_SERVICE \
                     CONFIG_EZPI_MDNS_ENABLE_BRAND_SERVICE \
                     CONFIG_EZPI_MDNS_ENABLE_MODEL_SERVICE \
                     CONFIG_EZPI_MDNS_ENABLE_NAME_SERVICE; do
            grep -q "^$sym=y" sdkconfig || {
              echo "::error::$sym did not get enabled in sdkconfig."
              fail=1
            }
            grep -q "^#define $sym 1" build/config/sdkconfig.h || {
              echo "::error::$sym is absent from the generated header, so its block was not compiled."
              fail=1
            }
          done

          # All four, not one. Each service is a separate #ifdef block with its
          # own allocation, its own getter call and its own ownership flag, so
          # a configuration that enabled one and silently dropped three would
          # leave three quarters of this job's subject uncompiled while still
          # going green.
          #
          # And the non-vacuity guard: every symbol above depends on
          # CONFIG_EZPI_SERV_MDNS_EN, so if mDNS itself were ever turned off in
          # the defaults, confgen would drop all five and the loop above would
          # fail with five identical errors that named the wrong cause.
          grep -q '^CONFIG_EZPI_SERV_MDNS_EN=y' sdkconfig || {
            echo "::error::CONFIG_EZPI_SERV_MDNS_EN is off; the five symbols above cannot be set at all."
            fail=1
          }

          if [ $fail -ne 0 ]; then
            echo "--- every EZPI_MDNS line in the generated sdkconfig ---"
            grep -n 'EZPI_MDNS\|EZPI_SERV_MDNS' sdkconfig || echo "(no matching lines at all)"
            echo "--- and in the generated header ---"
            grep -n 'EZPI_MDNS\|EZPI_SERV_MDNS' build/config/sdkconfig.h || echo "(no matching lines at all)"
            exit 1
          fi
          echo "all four extra mDNS services compiled, with mDNS itself enabled"

      # There is deliberately no nm assertion here, unlike the OTA, Improv and
      # MQTT jobs above. Every symbol those four blocks reference is already in
      # every image. EZPI_core_factory_info_v3_get_manufacturer is called from
      # six places besides ezlopi_core_mdns.c -- core_getters_api.c, twice in
      # ezlopi_service_ble_device_info.c, ezlopi_service_ble_provisioning.c,
      # ezlopi_service_uart.c, and EZPI_print_factory_info_v3 in its own module
      # (that last one behind ENABLE_TRACE, so five that are unconditional).
      # get_brand and get_model have the same six; get_name has five, by way of
      # ezlopi_service_improv.c instead of one of the BLE pair. The
      # ezlopi_*_str key literals are no better off.
      #
      # So an nm check over any of them would pass on the plain esp32 build
      # too, where all four blocks are preprocessed away -- a check that cannot
      # fail, which is worse than no check at all because it reads like
      # evidence.
      #
      # So the proof here is the pair of config assertions above plus the
      # compile itself: the symbols reached sdkconfig.h, therefore the #ifdefs
      # opened, therefore the compiler saw the four blocks and the build
      # succeeding means they are valid C that links.

  # Assembles install/ into a publishable directory: the static page plus the
  # merged image from each of the four firmware builds. See install/README.md.
  #
  # This job runs on every push and pull request even though publishing does
  # not, because the things that break an install page are all silent. A
  # manifest pointing at a path that does not exist still renders a working
  # button; it fails only once a user has plugged a board in and clicked it. A
  # chipFamily typo means that chip is simply never offered a build. Checking it
  # on every push is the only way those surface before a user hits them.
  #
  # It reuses the artifacts the firmware matrix already uploaded rather than
  # rebuilding, so the published images are the same bytes CI tested.
  install-page:
    name: Browser install page
    needs: firmware
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: artifacts

      - name: Assemble the page
        shell: bash
        run: |
          mkdir -p site
          cp install/index.html install/manifest.json site/

          # The image is located by name rather than by an assumed path.
          # upload-artifact roots an artifact at the least common ancestor of
          # the files it was given, so the layout inside depends on the other
          # paths in that upload list -- adding or removing one silently moves
          # everything. Searching cannot drift that way.
          for target in esp32 esp32s2 esp32s3 esp32c3; do
            src=$(find "artifacts/firmware-$target" -name merged-firmware.bin -print -quit 2>/dev/null || true)
            if [ -z "$src" ]; then
              echo "::error::no merged-firmware.bin in the firmware-$target artifact"
              echo "--- what that artifact does contain ---"
              find "artifacts/firmware-$target" -type f 2>/dev/null || echo "(no such artifact)"
              exit 1
            fi
            mkdir -p "site/$target"
            cp "$src" "site/$target/merged-firmware.bin"
            echo "$target <- $src"
          done

          # Stamp the commit over the committed placeholder, so the page and
          # the manifest name the source they were built from. The checker
          # below refuses to publish a page where this did not happen.
          version="${GITHUB_SHA:0:7}"
          sed -i "s/__VERSION__/$version/g" site/manifest.json site/index.html
          echo "stamped version $version"

      - name: Verify the page before it can be published
        shell: bash
        run: python3 tests/ci/check_install_page.py site

      # Available on every run, so a maintainer can download and serve it over
      # localhost to see exactly what would be published.
      - uses: actions/upload-artifact@v4
        with:
          name: install-page
          path: site
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  # Publishing is opt-in and off until a maintainer turns it on, for two
  # reasons: deploying needs repository settings a pull request cannot change,
  # and a job that goes red on master purely because Pages was never enabled
  # would be worse than having no page. The job above still builds and checks
  # the page on every push regardless, so nothing rots while this is off.
  #
  # To enable: set Settings -> Pages -> Source to "GitHub Actions", then add an
  # Actions variable PUBLISH_INSTALL_PAGE = true. An unset variable evaluates to
  # the empty string, so until both are done this job is skipped.
  deploy-install-page:
    name: Publish the install page
    needs: install-page
    # Folded (>-) rather than literal (|) so the expression reaches the
    # evaluator as one line.
    if: >-
      github.event_name == 'push' &&
      github.ref == 'refs/heads/master' &&
      vars.PUBLISH_INSTALL_PAGE == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
